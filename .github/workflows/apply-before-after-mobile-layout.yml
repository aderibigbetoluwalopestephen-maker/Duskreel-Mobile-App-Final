name: Apply Duskreel mobile editor layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile before/after layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'duskreel-before-after-category-layout-v1'
          if marker in text:
              print('Mobile layout patch already present; nothing to do.')
              raise SystemExit(0)

          style = r'''<style id="duskreel-before-after-category-layout-v1">
          /* Duskreel mobile editor: Before / After canvas + categorized tools */
          @media (max-width:760px){
            html,body,#app{width:100%;min-height:100dvh;background:#0b0b0d;}
            body{overflow:hidden!important;}
            #app{height:100dvh!important;overflow:hidden!important;}
            header{height:52px!important;min-height:52px!important;flex:0 0 52px!important;background:#09090b!important;border-bottom:1px solid #29292e!important;}
            main{height:calc(100dvh - 52px)!important;min-height:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;}
            main .rail{display:none!important;}

            /* Main Before / After workspace */
            main .stage,main .clean-stage{order:1!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;flex:0 0 43dvh!important;height:43dvh!important;min-height:230px!important;max-height:390px!important;padding:7px!important;background:#080809!important;border:0!important;border-bottom:1px solid #242428!important;overflow:hidden!important;}
            #beforeAfter.before-after{display:flex!important;flex-direction:row!important;align-items:stretch!important;justify-content:stretch!important;width:100%!important;height:100%!important;gap:0!important;background:#050506!important;border-radius:8px!important;overflow:hidden!important;}
            #beforeAfter .compare-pane{position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:1 1 50%!important;width:50%!important;height:100%!important;min-width:0!important;overflow:hidden!important;background:#09090b!important;}
            #beforeAfter .compare-pane + .compare-pane{border-left:2px solid #26262b!important;}
            #beforeAfter .compare-pane canvas,#beforeWork,#work{display:block!important;max-width:96%!important;max-height:100%!important;width:auto!important;height:auto!important;object-fit:contain!important;background:#0d0d10!important;box-shadow:none!important;}
            #beforeAfter .compare-label{position:absolute!important;top:7px!important;left:7px!important;z-index:20!important;padding:4px 7px!important;border-radius:5px!important;background:rgba(0,0,0,.76)!important;color:#fff!important;font-size:10px!important;font-weight:800!important;letter-spacing:.2px!important;}
            .compare-divider{display:block!important;width:2px!important;flex:0 0 2px!important;background:#26262b!important;}

            /* Thumbnail strip */
            .filmstrip{order:2!important;position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;flex:0 0 54px!important;height:54px!important;min-height:54px!important;width:100%!important;padding:6px 9px!important;background:#101012!important;border-top:0!important;border-bottom:1px solid #25252a!important;overflow-x:auto!important;overflow-y:hidden!important;}
            .filmstrip-meta{display:none!important;}
            .filmstrip #thumbList{height:42px!important;display:flex!important;gap:6px!important;overflow-x:auto!important;}
            .filmstrip .thumb{flex:0 0 50px!important;width:50px!important;height:42px!important;}

            /* Category buttons live directly under the canvas */
            #mobileEditTools{order:3!important;display:flex!important;flex:0 0 76px!important;height:76px!important;width:100%!important;align-items:stretch!important;gap:4px!important;overflow-x:auto!important;overflow-y:hidden!important;background:#111114!important;border-top:1px solid #25252a!important;border-bottom:1px solid #25252a!important;padding:6px 8px!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important;}
            #mobileEditTools::-webkit-scrollbar{display:none!important;}
            #mobileEditTools button{flex:0 0 70px!important;width:70px!important;height:64px!important;min-height:64px!important;border:0!important;border-radius:10px!important;background:transparent!important;color:#a9a9b2!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;padding:4px!important;font-size:9px!important;font-weight:800!important;white-space:nowrap!important;touch-action:manipulation!important;}
            #mobileEditTools button .tool-icon{width:30px!important;height:30px!important;border-radius:8px!important;background:#202025!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:16px!important;}
            #mobileEditTools button.active{background:#29292f!important;color:#fff!important;}
            #mobileEditTools button.active .tool-icon{background:#ff4fc3!important;color:#160d18!important;}

            /* Show one category panel at a time; More shows all panels */
            main .panel{order:4!important;display:block!important;flex:1 1 auto!important;width:100%!important;min-height:0!important;max-height:none!important;overflow-y:auto!important;overflow-x:hidden!important;background:#0b0b0d!important;border:0!important;padding:9px 9px 86px!important;-webkit-overflow-scrolling:touch!important;}
            main .panel .block{display:none!important;margin:0 0 8px!important;padding:12px!important;border:1px solid #27272c!important;border-radius:10px!important;background:#151519!important;}
            main .panel .block.mobile-category-visible{display:block!important;}
            main .panel.mobile-show-all .block{display:block!important;}
            main .panel .block[data-mobile-static="true"]{display:block!important;}
            main .panel .panel-title{font-size:11px!important;letter-spacing:.8px!important;color:#b9b9c0!important;}
            main .panel input[type=range]{min-height:30px!important;}

            /* Keep the real bottom navigation visible */
            .mobile-app-nav{z-index:5000!important;}
          }
          @media (max-width:430px){
            main .stage,main .clean-stage{flex-basis:40dvh!important;height:40dvh!important;min-height:220px!important;}
            #beforeAfter .compare-pane canvas,#beforeWork,#work{max-width:94%!important;}
            #mobileEditTools{flex-basis:72px!important;height:72px!important;gap:2px!important;padding:5px 6px!important;}
            #mobileEditTools button{flex-basis:63px!important;width:63px!important;height:61px!important;min-height:61px!important;}
          }
          </style>'''

          script = r'''<script id="duskreel-before-after-category-layout-v1-script">
          (()=>{
            const tools = document.getElementById('mobileEditTools');
            const panel = document.querySelector('main .panel');
            if(!tools || !panel) return;

            const normalize = s => (s || '').trim().toLowerCase();
            const blocks = [...panel.querySelectorAll(':scope > .block')];
            const findBlock = (...names) => blocks.find(b => names.includes(normalize(b.querySelector('.panel-title, h2')?.textContent)));

            const categories = {
              adjust: ['basic'],
              filters: ['presets'],
              effects: ['ai color grading'],
              crop: ['crop'],
              retouch: ['retouch'],
              ai: ['ai tools', 'one-click ai background replacement', 'lens / background'],
              watermark: ['watermark'],
              more: []
            };

            function setCategory(name){
              if(!panel || !tools) return;
              panel.classList.toggle('mobile-show-all', name === 'more');
              blocks.forEach(b => b.classList.remove('mobile-category-visible'));
              if(name !== 'more'){
                (categories[name] || []).forEach(title => {
                  const b = findBlock(title);
                  if(b) b.classList.add('mobile-category-visible');
                });
              }
              tools.querySelectorAll('button[data-mobile-tool]').forEach(btn => btn.classList.toggle('active', btn.dataset.mobileTool === name));
              const first = panel.querySelector('.mobile-category-visible');
              if(first && name !== 'more') first.scrollIntoView({block:'start',behavior:'smooth'});
            }

            tools.querySelectorAll('button[data-mobile-tool]').forEach(btn => {
              btn.addEventListener('click', () => setCategory(btn.dataset.mobileTool));
            });

            // Start with Adjust without altering desktop behavior.
            if(matchMedia('(max-width:760px)').matches) setCategory('adjust');
            addEventListener('resize', () => {
              if(!matchMedia('(max-width:760px)').matches){
                panel.classList.remove('mobile-show-all');
                blocks.forEach(b => b.classList.remove('mobile-category-visible'));
              }
            });
          })();
          </script>'''

          # Insert the new style just before </head> and script just before </body>.
          text = text.replace('</head>', style + '\n</head>', 1)
          text = text.replace('</body>', script + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Applied mobile Before/After + categorized tool layout.')

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          git commit -m "Update mobile Before After editor layout"
          git push
