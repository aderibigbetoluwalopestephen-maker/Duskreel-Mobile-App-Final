name: Duskreel feature audit

on:
  push:
    paths:
      - '.github/workflows/audit-features.yml'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:

concurrency:
  group: duskreel-feature-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static feature and wiring audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html.parser import HTMLParser
          s=Path('index.html').read_text(encoding='utf-8')
          print('=== DUSKREEL FEATURE AUDIT ===')
          print('HTML bytes:',len(s))
          print('script tags:',s.lower().count('<script'))
          print('style tags:',s.lower().count('<style'))
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]; self.buttons=[]; self.inputs=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if 'id' in d:self.ids.append(d['id'])
              if tag=='button':self.buttons.append(d)
              if tag=='input':self.inputs.append(d)
          p=P();p.feed(s);ids=set(p.ids)
          print('unique ids:',len(ids),'duplicate ids:',sorted({x for x in p.ids if p.ids.count(x)>1}))
          print('buttons:',len(p.buttons))
          print('file inputs:',[(x.get('id'),x.get('accept'),x.get('capture')) for x in p.inputs if x.get('type')=='file'])
          refs=set(re.findall(r"getElementById\(['\"]([^'\"]+)",s)); refs|=set(re.findall(r"querySelector(?:All)?\(['\"]#([^'\"]+)",s))
          print('MISSING JS IDs:',sorted(x for x in refs if x not in ids))
          checks={
            'sign-in':'nameForm|nameInput','upload':'photoInput|type="file"','download':'downloadOne|triggerDownload',
            'crop':'cropTools|enterCropMode','filters':'fxGrid','effects':'effect|effects','retouch':'spotToggle',
            'AI':'autoEditBtn|applyAutoEdit','watermark':'watermarkBtn|watermarkInput','undo/redo':'undoBtn|redoBtn',
            'compare':'beforeWork|compare-pane','queue':'queue|photos','logout':'logoutBtn|doLogout',
            'mobile toolbar':'mobileEditTools|data-mobile-tool'
          }
          for n,pat in checks.items(): print(n,':',len(re.findall(pat,s,re.I)))
          PY

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S)
          print('inline script blocks:',len(scripts))
          for i,js in enumerate(scripts,1): Path(f'/tmp/duskreel-script-{i}.js').write_text(js,encoding='utf-8')
          PY
          set -e
          for f in /tmp/duskreel-script-*.js; do [ -e "$f" ] && node --check "$f"; done

      - name: Browser smoke test for core features
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR: '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text());});
            await page.goto('file://' + process.cwd() + '/index.html');
            await page.waitForTimeout(300);
            console.log('auth visible:',await page.locator('#authScreen').isVisible());
            await page.locator('#nameInput').fill('Test User');
            await page.locator('#nameForm button[type=submit]').click();
            await page.waitForTimeout(200);
            console.log('app visible after sign-in:',await page.locator('#app').isVisible());
            const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
            await page.locator('#photoInput').setInputFiles({name:'test.png',mimeType:'image/png',buffer:png});
            await page.waitForTimeout(700);
            console.log('photos loaded:',await page.locator('.filmstrip img').count());
            console.log('toolbar buttons:',await page.locator('#mobileEditTools button').count());
            for(const name of ['adjust','filters','effects','crop','retouch','ai','watermark']){
              const b=page.locator(`[data-mobile-tool="${name}"]`);
              if(await b.count()){await b.click(); await page.waitForTimeout(50); console.log('toolbar click',name,'ok');}
            }
            const dl=page.locator('#downloadOne');
            console.log('download button visible:',await dl.isVisible().catch(()=>false));
            console.log('undo button exists:',await page.locator('#undoBtn').count(),'redo:',await page.locator('#redoBtn').count());
            console.log('crop controls:',await page.locator('#cropTools button').count());
            console.log('filter controls:',await page.locator('#fxGrid').count());
            console.log('AI button:',await page.locator('#autoEditBtn').count());
            console.log('retouch button:',await page.locator('#spotToggle').count());
            console.log('logout button:',await page.locator('#logoutBtn').count());
            await page.locator('#logoutBtn').click();
            await page.waitForTimeout(150);
            console.log('logout returned to auth:',await page.locator('#authScreen').isVisible());
            console.log('page errors:',errors);
            if(errors.length) process.exitCode=2;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
