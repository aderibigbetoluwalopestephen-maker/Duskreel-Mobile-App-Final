name: Duskreel feature audit

on:
  push:
    paths:
      - '.github/workflows/audit-features.yml'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:

concurrency:
  group: duskreel-feature-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static feature and wiring audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html.parser import HTMLParser

          s=Path('index.html').read_text(encoding='utf-8')
          print('=== DUSKREEL FEATURE AUDIT ===')
          print('HTML bytes:',len(s))
          print('script tags:',s.lower().count('<script'))
          print('style tags:',s.lower().count('<style'))

          class P(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]; self.buttons=[]; self.inputs=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if 'id' in d:self.ids.append(d['id'])
              if tag=='button':self.buttons.append(d)
              if tag=='input':self.inputs.append(d)
          p=P();p.feed(s);ids=set(p.ids)
          print('unique ids:',len(ids),'duplicate ids:',sorted({x for x in p.ids if p.ids.count(x)>1}))
          print('buttons:',len(p.buttons))
          print('file inputs:',[(x.get('id'),x.get('accept'),x.get('capture')) for x in p.inputs if x.get('type')=='file'])

          refs=set(re.findall(r"getElementById\(['\"]([^'\"]+)",s))
          refs|=set(re.findall(r"querySelector(?:All)?\(['\"]#([^'\"]+)",s))
          print('MISSING JS IDs:',sorted(x for x in refs if x not in ids))

          checks={
            'sign-in form':'nameForm','name input':'nameInput','app shell':'id="app"',
            'upload input':'type="file"','photo input':'id="photoInput"','background input':'id="bgImageInput"',
            'watermark input':'id="watermarkInput"','preset input':'id="presetInput"',
            'download':'downloadOne|triggerDownload','export preview':'exportPreview|downloadPreview',
            'crop':'cropTools|crop','filters':'fxGrid','effects':'effects|effect','retouch':'spotToggle|retouch',
            'AI clean/noise':'autoEditBtn|noise|clean','watermark':'watermarkBtn|watermark',
            'undo redo':'undo|redo','reset':'reset','compare':'before|after|compare',
            'queue':'queue','queue delete':'delete.*queue|remove.*queue|clear.*queue',
            'logout':'logout|log out','mobile toolbar':'mobileEditTools|data-mobile-tool',
            'service worker':'serviceWorker|sw\.js'
          }
          for n,pat in checks.items():
            hits=re.findall(pat,s,re.I)
            print(f'{n}: {len(hits)}')

          # Print exact HTML/JS lines around key feature identifiers.
          lines=s.splitlines()
          terms=['photoInput','bgImageInput','downloadOne','triggerDownload','cropTools','fxGrid','spotToggle','autoEditBtn','watermarkBtn','undo','redo','reset','compare','queue','logout','mobileEditTools','serviceWorker','DUSKREEL-FINAL-MOBILE-EDITOR-FIX']
          print('=== KEY SOURCE LINES ===')
          seen=set()
          for i,line in enumerate(lines,1):
            if any(t.lower() in line.lower() for t in terms):
              key=(i,line.strip())
              if key not in seen:
                seen.add(key); print(f'{i}: {line[:500]}')
          PY

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S)
          print('inline script blocks:',len(scripts))
          for i,js in enumerate(scripts,1): Path(f'/tmp/duskreel-script-{i}.js').write_text(js,encoding='utf-8')
          PY
          for f in /tmp/duskreel-script-*.js; do [ -e "$f" ] && node --check "$f"; done
