name: Duskreel feature audit

on:
  push:
    paths:
      - '.github/workflows/audit-features.yml'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:

concurrency:
  group: duskreel-feature-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static HTML and JavaScript audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html.parser import HTMLParser

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          print('=== DUSKREEL FEATURE AUDIT ===')
          print('HTML bytes:', len(s))
          print('script tags:', len(re.findall(r'<script\\b', s, re.I)))
          print('style tags:', len(re.findall(r'<style\\b', s, re.I)))

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.buttons=[]; self.inputs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.append(d['id'])
                  if tag=='button': self.buttons.append(d)
                  if tag=='input': self.inputs.append(d)
          q=Parser(); q.feed(s)
          ids=set(q.ids)
          print('unique ids:', len(ids), 'duplicate ids:', sorted({x for x in q.ids if q.ids.count(x)>1}))
          print('buttons:', len(q.buttons), 'file inputs:', [(x.get('id'),x.get('accept'),x.get('multiple')) for x in q.inputs if x.get('type')=='file'])

          # IDs used by JS selectors / getElementById.
          refs=set(re.findall(r"(?:getElementById\\(['\"]([^'\"]+)|querySelector\\(['\"]#([^'\"]+))", s))
          ref_ids={a or b for a,b in refs if (a or b)}
          missing=sorted(x for x in ref_ids if x not in ids)
          print('JS-referenced IDs:', len(ref_ids))
          print('MISSING JS IDs:', missing)

          # Common direct element selectors.
          selectors=sorted(set(re.findall(r"querySelector(?:All)?\\(['\"]([^'\"]+)['\"]", s)))
          for sel in selectors:
              if sel.startswith('#') and sel[1:] not in ids:
                  print('MISSING selector:', sel)

          # Inline onclick / onchange references.
          inline=[]
          for m in re.finditer(r'on(click|change|input|load|submit)\\s*=\\s*["\']([^"\']+)', s, re.I):
              inline.append((m.group(1),m.group(2)))
          print('inline handlers:', len(inline))

          # Feature markers and handlers.
          checks={
            'upload input': r'type=["\']file',
            'camera input': r'id=["\']cameraInput',
            'photo input': r'id=["\']photoInput',
            'download handler': r'triggerDownload|downloadOne',
            'crop code': r'cropTools|crop',
            'filter grid': r'fxGrid|filter',
            'effects': r'effect|effects',
            'retouch': r'spotToggle|retouch|spot',
            'AI': r'autoEditBtn|noise|clean',
            'watermark': r'watermarkBtn|watermark',
            'undo/redo': r'undo|redo',
            'reset': r'reset',
            'before/after': r'before|compare',
            'queue/delete': r'queue|delete.*queue|remove.*queue',
            'logout': r'logout|log out',
            'PWA service worker': r'serviceWorker|sw\\.js',
            'mobile toolbar': r'mobileEditTools|data-mobile-tool',
          }
          for name,pat in checks.items(): print(f'{name}:', bool(re.search(pat,s,re.I)))

          # JS syntax sanity: extract scripts and report obvious unterminated blocks/strings only.
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S)
          print('inline script blocks:', len(scripts))
          for i,js in enumerate(scripts,1):
              print(f'script {i}: chars={len(js)} braces={js.count("{")}/{js.count("}")} parens={js.count("(")}/{js.count(")")} brackets={js.count("[")}/{js.count("]")}')
          PY

      - name: Browser smoke test with Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR: '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text());});
            await page.goto('file://' + process.cwd() + '/index.html');
            await page.waitForTimeout(500);
            console.log('=== BROWSER SMOKE TEST ===');
            console.log('title:', await page.title());
            console.log('auth visible:', await page.locator('#authScreen').isVisible().catch(()=>false));
            console.log('continue visible:', await page.locator('#nameForm button[type=submit]').isVisible().catch(()=>false));
            await page.locator('#nameInput').fill('Test User');
            await page.locator('#nameForm button[type=submit]').click();
            await page.waitForTimeout(200);
            console.log('app after sign-in:', await page.locator('#app').isVisible().catch(()=>false));
            console.log('upload file inputs:', await page.locator('input[type=file]').count());
            console.log('mobile toolbar:', await page.locator('#mobileEditTools').isVisible().catch(()=>false));
            console.log('toolbar buttons:', await page.locator('#mobileEditTools button').count());
            console.log('download buttons:', await page.locator('#downloadOne').count());
            console.log('logout candidates:', await page.locator('button,a,[role=button]').evaluateAll(es=>es.filter(e=>/log\\s*out/i.test(e.textContent||'')||e.id==='logoutBtn').map(e=>({id:e.id,text:(e.textContent||'').trim()}))));
            console.log('page errors:', errors);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
