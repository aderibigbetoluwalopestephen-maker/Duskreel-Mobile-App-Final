name: Duskreel browser final test
on:
  push:
    paths:
      - '.github/workflows/browser-final-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Test login upload toolbar and logout
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'domcontentloaded',timeout:15000});
            await page.locator('#nameInput').fill('Test User');
            await page.locator('#nameForm button[type="submit"]').click();
            await page.waitForTimeout(200);
            console.log('LOGIN_APP_VISIBLE=',await page.locator('#app').isVisible());
            const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
            await page.locator('#photoInput').setInputFiles({name:'test.png',mimeType:'image/png',buffer:png});
            await page.waitForTimeout(500);
            console.log('PHOTO_LOADED=',await page.locator('#thumbList .thumb').count());
            console.log('TOOLBAR_COUNT=',await page.locator('#mobileEditTools button').count());
            console.log('CAMERA_INPUT=',await page.locator('#cameraInput').count());
            console.log('QUEUE_DELETE=',await page.locator('.thumb-remove').count());
            console.log('CROP=',await page.locator('#cropTools').count());
            console.log('FILTERS=',await page.locator('#fxGrid').count());
            console.log('AI=',await page.locator('#autoEditBtn').count());
            console.log('RETOUCH=',await page.locator('#spotToggle').count());
            console.log('WATERMARK=',await page.locator('#watermarkBtn').count());
            console.log('DOWNLOAD=',await page.locator('#downloadOne').count());
            console.log('LOGOUT=',await page.locator('#logoutBtn').count());
            await page.locator('#logoutBtn').click();
            await page.waitForTimeout(150);
            console.log('LOGOUT_TO_AUTH=',await page.locator('#authScreen').isVisible());
            console.log('PAGE_ERRORS=',JSON.stringify(errors));
            if(!await page.locator('#app').isVisible()) throw new Error('Login did not open app');
            if(await page.locator('#thumbList .thumb').count()<1) throw new Error('Upload did not load photo');
            if(await page.locator('#mobileEditTools button').count()<8) throw new Error('Mobile toolbar incomplete');
            if(await page.locator('.thumb-remove').count()<1) throw new Error('Queue delete missing');
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
