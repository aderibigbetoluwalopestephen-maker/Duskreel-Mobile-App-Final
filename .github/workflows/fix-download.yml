name: Fix mobile download

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch download flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.compile(r'function triggerDownload\(dataUrl, filename\)\{.*?\n\}\nfunction dataUrlToBlob', re.S)
          new=r'''async function triggerDownload(dataUrl, filename){
            try{
              const blob=dataUrlToBlob(dataUrl);
              const type=blob.type || 'image/jpeg';
              const file=new File([blob], filename, {type});
              // Mobile Safari/iOS: use the native share/save sheet when available.
              if(/iphone|ipad|ipod/i.test(navigator.userAgent) && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
                await navigator.share({files:[file],title:'Duskreel export'});
                return true;
              }
              const url=URL.createObjectURL(blob);
              const link=document.createElement('a');
              link.href=url;
              link.download=filename;
              link.setAttribute('download',filename);
              link.rel='noopener';
              link.style.cssText='position:fixed;left:-9999px;width:1px;height:1px;opacity:0;';
              document.body.appendChild(link);
              link.click();
              setTimeout(()=>{try{link.remove();URL.revokeObjectURL(url);}catch{}},3000);
              return true;
            }catch(err){
              console.error('Download failed:',err);
              try{
                const blob=dataUrlToBlob(dataUrl);
                const url=URL.createObjectURL(blob);
                // Last fallback: open the actual file so mobile users can save it.
                const win=window.open(url,'_blank','noopener');
                if(!win){ window.location.href=url; }
                setTimeout(()=>URL.revokeObjectURL(url),30000);
                return true;
              }catch(_){ return false; }
            }
          }
          function dataUrlToBlob'''
          if old.search(s):
              s=old.sub(new,s,count=1)
          else:
              raise SystemExit('triggerDownload function not found; no changes made')
          s=s.replace("el('exportPreviewDownload')?.addEventListener('click',()=>{\n  if(!pendingExport) return;\n  const ok=triggerDownload(pendingExport.dataUrl,pendingExport.filename);\n  if(!ok){ alert('Download could not start. Please use the browser Share/Save option.'); return; }\n  closeExportPreview();\n});", "el('exportPreviewDownload')?.addEventListener('click',async()=>{\n  if(!pendingExport) return;\n  const btn=el('exportPreviewDownload');\n  const original=btn.textContent; btn.disabled=true; btn.textContent='Saving…';\n  try{\n    const ok=await triggerDownload(pendingExport.dataUrl,pendingExport.filename);\n    if(!ok){ alert('Download could not start. Please try again or use Save/Share from your browser.'); return; }\n    closeExportPreview();\n  }finally{ btn.disabled=false; btn.textContent=original; }\n});")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Refresh service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('duskreel-mobile-v3','duskreel-mobile-v4')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix mobile download and save fallback'
          git push
