name: Fix mobile Continue button

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile-safe Continue flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- DUSKREEL-MOBILE-CONTINUE-FIX -->'
          if marker not in s:
              patch=r'''<!-- DUSKREEL-MOBILE-CONTINUE-FIX -->
          <style>
          @media (max-width:760px){
            #authScreen .auth-submit{position:relative!important;z-index:9999!important;pointer-events:auto!important;touch-action:manipulation!important;cursor:pointer!important;-webkit-tap-highlight-color:transparent!important;}
            #authScreen .auth-form{position:relative!important;z-index:1000!important;}
            #authScreen input{position:relative!important;z-index:1001!important;pointer-events:auto!important;}
          }
          </style>
          <script>
          (function(){
            function mobileContinue(){
              var input=document.getElementById('nameInput');
              var error=document.getElementById('nameError');
              var auth=document.getElementById('authScreen');
              var app=document.getElementById('app');
              var label=document.getElementById('userLabel');
              if(!input||!auth||!app) return false;
              var name=(input.value||'').trim();
              if(!name){
                if(error) error.classList.add('show');
                input.focus();
                return false;
              }
              if(error) error.classList.remove('show');
              try{localStorage.setItem('duskreel_user_name',name);}catch(e){}
              auth.style.display='none';
              auth.setAttribute('aria-hidden','true');
              app.style.display='flex';
              app.removeAttribute('aria-hidden');
              if(label) label.textContent='Signed in as '+name;
              window.scrollTo(0,0);
              return false;
            }
            window.duskreelMobileContinue=mobileContinue;
            document.addEventListener('DOMContentLoaded',function(){
              var form=document.getElementById('nameForm');
              var btn=form&&form.querySelector('.auth-submit');
              if(!form||!btn) return;
              btn.type='button';
              btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();mobileContinue();},true);
              btn.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();mobileContinue();},{passive:false,capture:true});
              form.addEventListener('submit',function(e){e.preventDefault();e.stopPropagation();mobileContinue();},true);
              var saved='';
              try{saved=localStorage.getItem('duskreel_user_name')||'';}catch(e){}
              if(saved) document.getElementById('nameInput').value=saved;
            });
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Refresh service worker cache
        run: sed -i "s/duskreel-mobile-v[0-9]*/duskreel-mobile-v5/g" sw.js || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Fix mobile Continue button"
          git push
