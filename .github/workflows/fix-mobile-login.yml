name: Fix mobile Continue sign-in

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile login with independent handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</div>\n<div id="app" style="display:none;">'
          patch = '''</div>
<script id="duskreel-mobile-login-fix">
(function(){
  function setup(){
    const form=document.getElementById('nameForm');
    const input=document.getElementById('nameInput');
    const error=document.getElementById('nameError');
    const auth=document.getElementById('authScreen');
    const app=document.getElementById('app');
    const label=document.getElementById('userLabel');
    if(!form||!input||!auth||!app) return;
    function enter(){
      const name=(input.value||'').trim();
      if(!name){ if(error) error.classList.add('show'); input.focus(); return false; }
      if(error) error.classList.remove('show');
      try{ localStorage.setItem('duskreel.userName',name); }catch(e){}
      auth.style.display='none';
      app.style.display='flex';
      if(label) label.textContent='Signed in as '+name;
      return false;
    }
    form.addEventListener('submit',function(e){e.preventDefault();e.stopImmediatePropagation();return enter();},true);
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();enter();}},true);
    window.duskreelMobileLogin=enter;
    try{
      const saved=localStorage.getItem('duskreel.userName');
      if(saved){ input.value=saved; enter(); }
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup,{once:true}); else setup();
})();
</script>
<div id="app" style="display:none;">'''
          if 'id="duskreel-mobile-login-fix"' not in s:
              if marker not in s:
                  raise SystemExit('Auth marker not found')
              s=s.replace(marker,patch,1)
          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'duskreel-mobile-login-fix' in s
          assert 'duskreelMobileLogin' in s
          print('Mobile login fix is present.')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix mobile Continue sign-in flow'
          git push
