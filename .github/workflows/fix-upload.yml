name: Fix mobile photo upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile photo picker and upload controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- DUSKREEL-MOBILE-UPLOAD-FIX -->'
          if marker not in s:
              patch=r'''<!-- DUSKREEL-MOBILE-UPLOAD-FIX -->
          <style>
          @media (max-width:760px){
            input[type="file"]{position:fixed!important;left:-10000px!important;top:-10000px!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;}
            .mobile-app-nav button[data-mobile-action="photos"],.mobile-app-nav button[data-mobile-action="camera"]{position:relative!important;z-index:5000!important;pointer-events:auto!important;touch-action:manipulation!important;}
          }
          </style>
          <script>
          (function(){
            function getImageInput(){
              var preferred=document.getElementById('photoInput') || document.getElementById('imageInput') || document.getElementById('fileInput');
              if(preferred && preferred.type==='file') return preferred;
              var inputs=[].slice.call(document.querySelectorAll('input[type="file"]'));
              return inputs.find(function(x){return (x.accept||'').toLowerCase().includes('image')}) || inputs[0] || null;
            }
            function openPicker(){
              var input=getImageInput();
              if(!input) return false;
              try{
                input.accept='image/*';
                input.multiple=true;
                input.removeAttribute('disabled');
                input.click();
                return true;
              }catch(err){
                console.error('Duskreel photo picker failed',err);
                return false;
              }
            }
            function openCamera(){
              var input=getImageInput();
              if(!input) return false;
              try{
                input.accept='image/*';
                input.removeAttribute('disabled');
                input.setAttribute('capture','environment');
                input.click();
                setTimeout(function(){input.removeAttribute('capture');},1000);
                return true;
              }catch(err){
                console.error('Duskreel camera picker failed',err);
                return false;
              }
            }
            function bindUploadButtons(){
              var nav=document.getElementById('mobileAppNav');
              if(nav){
                nav.addEventListener('click',function(e){
                  var btn=e.target.closest('button[data-mobile-action]');
                  if(!btn) return;
                  var action=btn.getAttribute('data-mobile-action');
                  if(action==='photos'){
                    e.preventDefault();e.stopImmediatePropagation();openPicker();
                  }else if(action==='camera'){
                    e.preventDefault();e.stopImmediatePropagation();openCamera();
                  }
                },true);
              }
              document.addEventListener('click',function(e){
                var trigger=e.target.closest('[data-upload-photo],#addPhotoBtn,#uploadPhotoBtn,.upload-photo-btn');
                if(trigger){e.preventDefault();openPicker();}
              },true);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bindUploadButtons,{once:true}); else bindUploadButtons();
            window.duskreelOpenPhotoPicker=openPicker;
            window.duskreelOpenCamera=openCamera;
          })();
          </script>
          '''
              if '</body>' in s:
                  s=s.replace('</body>',patch+'\n</body>',1)
              else:
                  s += '\n'+patch
              p.write_text(s,encoding='utf-8')
          PY

      - name: Refresh service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'duskreel-mobile-v[0-9]+','duskreel-mobile-v7',s)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit upload fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix mobile photo upload and picker'
          git push
