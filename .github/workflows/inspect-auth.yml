name: Inspect Duskreel auth markup
on:
  push:
    paths:
      - '.github/workflows/inspect-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- nameForm ---'
          grep -n -A30 -B10 'id="nameForm"' index.html || true
          echo '--- nameInput ---'
          grep -n -A12 -B8 'id="nameInput"' index.html || true
          echo '--- auth submit/continue ---'
          grep -n -E 'auth-submit|Continue|type="submit"' index.html | head -80 || true
