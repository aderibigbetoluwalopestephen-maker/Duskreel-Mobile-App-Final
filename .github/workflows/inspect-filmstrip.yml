name: Inspect Duskreel filmstrip
on:
  push:
    paths:
      - '.github/workflows/inspect-filmstrip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- FILMSTRIP MARKUP ---'
          grep -n -A40 -B15 'class="filmstrip"' index.html | head -120 || true
          echo '--- RENDER THUMBS ---'
          grep -n -A100 -B15 'function renderThumbs' index.html | head -180 || true
          echo '--- PHOTO REMOVAL TERMS ---'
          grep -n -E 'removePhoto|deletePhoto|remove.*photo|delete.*photo|photos\.splice|state\.photos' index.html | head -160 || true
