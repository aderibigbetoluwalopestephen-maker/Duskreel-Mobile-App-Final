name: Duskreel mobile professional editor fix
on:
  push:
    paths:
      - '.github/workflows/mobile-professional-fix.yml'
  workflow_dispatch:
concurrency:
  group: duskreel-mobile-professional-fix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile upload, tool grouping and layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="duskreel-mobile-tool-modes-v1">.*?</style>\\n?', '', s, flags=re.S)
          s=re.sub(r'<script id="duskreel-mobile-tool-modes-v1">.*?</script>\\n?', '', s, flags=re.S)
          s=re.sub(r'<script id="duskreel-final-mobile-editor-js">.*?</script>\\n?', '', s, flags=re.S)
          if 'id="cameraInput"' not in s:
              s=s.replace('<input type="file" id="photoInput" accept="image/*" multiple>', '<input type="file" id="photoInput" accept="image/*" multiple>\n    <input type="file" id="cameraInput" accept="image/*" capture="environment">')
          marker='<!-- DUSKREEL-MOBILE-PROFESSIONAL-FIX-V1 -->'
          if marker not in s:
              block='''
<!-- DUSKREEL-MOBILE-PROFESSIONAL-FIX-V1 -->
<style id="duskreel-mobile-professional-fix">
@media(max-width:760px){
