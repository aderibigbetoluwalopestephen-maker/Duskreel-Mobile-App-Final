  #mobileEditTools::-webkit-scrollbar{display:none!important;}
  #mobileEditTools button{flex:0 0 64px!important;width:64px!important;height:60px!important;min-height:60px!important;padding:3px!important;border:0!important;border-radius:9px!important;background:transparent!important;color:#a8a8b0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:3px!important;font-size:8.5px!important;font-weight:800!important;white-space:nowrap!important;}
