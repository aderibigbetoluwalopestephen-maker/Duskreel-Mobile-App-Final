</style>
<div id="mobileEffectsSection" class="mobile-tool-section" aria-label="Effects"><h2>Effects</h2><div class="mobile-effect-grid" id="mobileEffectGrid"></div></div>
<script id="duskreel-mobile-professional-fix-js">
(function(){
  const panel=()=>document.querySelector('.panel.lightroom-panel')||document.querySelector('.panel');
  const block=sel=>{const e=document.querySelector(sel);return e?e.closest('.block'):null;};
  const unique=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
  const tools=document.getElementById('mobileEditTools'), p=panel();
  if(!tools||!p)return;
  const drop=document.getElementById('dropZone');
  if(drop&&!drop.querySelector('.mobile-upload-actions')){
    const actions=document.createElement('div'); actions.className='mobile-upload-actions';
    actions.innerHTML='<button type="button" class="primary-upload" data-upload-action="photos">Add Photos</button><button type="button" data-upload-action="camera">Camera</button>';
    drop.appendChild(actions);
    actions.addEventListener('click',e=>{const b=e.target.closest('button[data-upload-action]');if(!b)return;e.preventDefault();e.stopPropagation();if(b.dataset.uploadAction==='photos')document.getElementById('photoInput')?.click();else document.getElementById('cameraInput')?.click();});
  }
  const cam=document.getElementById('cameraInput'), photo=document.getElementById('photoInput');
  if(cam&&photo&&!cam.dataset.bridge){cam.dataset.bridge='1';cam.addEventListener('change',()=>{if(!cam.files?.length)return;try{const dt=new DataTransfer();for(const f of cam.files)dt.items.add(f);photo.files=dt.files;photo.dispatchEvent(new Event('change',{bubbles:true}));}catch(err){console.warn('camera bridge',err);}});}
  const preset=block('#fxGrid'), basic=block('#expSlider'), crop=block('#cropTools'), retouch=block('#spotToggle'), watermark=block('#watermarkBtn'), ai=block('#autoEditBtn'), color=block('.grade-btn'), bg=block('#replaceBgBtn'), lens=block('#bgRemoveBtn'), presetFile=block('#presetBtn'), histogram=block('.histogram');
  const allBlocks=Array.from(p.querySelectorAll(':scope > .block'));
  const effectSection=document.getElementById('mobileEffectsSection'), grid=document.getElementById('mobileEffectGrid');
  if(effectSection&&grid&&!effectSection.dataset.ready){
    effectSection.dataset.ready='1';
    document.querySelectorAll('#fxGrid .fx-swatch').forEach(real=>{
      const id=real.dataset.fx||'';
      if(id.startsWith('lr-')||id.startsWith('saved-fx-'))return;
      const b=document.createElement('button'); b.type='button'; b.dataset.effectId=id;
      const sw=real.querySelector('.fx-dot'), label=real.querySelector('span');
      b.innerHTML='<span class="effect-swatch"></span><span></span>';
      b.querySelector('.effect-swatch').style.background=sw?.style.background||'linear-gradient(135deg,#555,#222)';
      b.querySelector('span:last-child').textContent=label?.textContent||id;
      b.addEventListener('click',()=>{real.click();grid.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));});
      grid.appendChild(b);
    });
  }
  if(effectSection&&effectSection.parentElement!==p)p.insertBefore(effectSection,p.firstChild);
  const groups={adjust:unique([basic]),filters:unique([preset]),effects:[],crop:unique([crop]),retouch:unique([retouch]),ai:unique([ai,color,bg]),watermark:unique([watermark]),more:unique([histogram,preset,ai,color,bg,crop,lens,retouch,watermark,presetFile,basic])};
  function hide(){allBlocks.forEach(b=>b.classList.add('mobile-tool-hidden'));effectSection?.classList.remove('active');}
  function show(name){hide();if(name==='effects'){effectSection?.classList.add('active');p.scrollTo({top:0,behavior:'smooth'});return;}const list=groups[name]||[];list.forEach(b=>b.classList.remove('mobile-tool-hidden'));if(list[0])requestAnimationFrame(()=>p.scrollTo({top:Math.max(0,list[0].offsetTop-8),behavior:'smooth'}));}
  hide();
  tools.querySelectorAll('button[data-mobile-tool]').forEach(b=>b.classList.remove('active'));
  tools.addEventListener('click',e=>{const b=e.target.closest('button[data-mobile-tool]');if(!b)return;tools.querySelectorAll('button[data-mobile-tool]').forEach(x=>x.classList.toggle('active',x===b));show(b.dataset.mobileTool);});
  window.duskreelMobileToolShow=show;
})();
</script>
'''
              s=s.replace('</body>',block+'\n</body>')
          sw=Path('sw.js')
          if sw.exists():
              t=sw.read_text(encoding='utf-8')
              t=re.sub(r"duskreel-mobile-v\\d+","duskreel-mobile-v9",t)
              sw.write_text(t,encoding='utf-8')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              f=Path(tempfile.gettempdir())/f'duskreel-script-{i}.js'; f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(1)
          print('All inline script blocks passed node --check')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fix mobile upload and professional tool grouping"
          git push
