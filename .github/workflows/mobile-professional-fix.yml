name: Duskreel mobile professional editor fix
on:
  push:
    paths:
      - '.github/workflows/mobile-professional-fix.yml'
      - 'scripts/mobile_professional_fix.py'
  workflow_dispatch:
concurrency:
  group: duskreel-mobile-professional-fix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile professional fix
        run: python scripts/mobile_professional_fix.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              f=Path(tempfile.gettempdir())/f'duskreel-script-{i}.js'
              f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(1)
          print('All inline script blocks passed node --check')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fix mobile upload and professional tool grouping"
          git push
