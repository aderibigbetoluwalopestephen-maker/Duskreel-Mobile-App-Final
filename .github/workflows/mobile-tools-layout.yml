name: Improve Duskreel mobile tools
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PixelLab-style mobile toolbar
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='DUSKREEL-PIXELLAB-STYLE-TOOLS-V2'
          if marker in s:
              print('already installed'); raise SystemExit(0)
          css=r'''\n/* DUSKREEL-PIXELLAB-STYLE-TOOLS-V2 */
@media(max-width:800px){
body{overflow:hidden!important} #app{height:100dvh!important}
main{display:block!important;position:relative!important;height:calc(100dvh - 52px)!important;overflow:hidden!important}
main .rail,main .panel{display:none!important}
main .stage{position:absolute!important;inset:0 0 150px!important;padding:42px 8px 12px!important;display:flex!important;align-items:center!important;justify-content:center!important}
canvas#work{max-width:96vw!important;max-height:calc(100dvh - 230px)!important}
#duskPixelDock{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:90;background:#100812;border-top:1px solid var(--line);box-shadow:0 -10px 30px #0008;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#duskPixelTools{height:88px;display:flex;gap:9px;overflow-x:auto;padding:8px 10px;background:var(--panel)}
.dpt-tool{flex:0 0 76px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px;cursor:pointer}.dpt-tool:active{transform:scale(.96)}
.dpt-icon{font-size:21px;line-height:22px}.dpt-label{font-size:9px;color:var(--ink-dim);text-align:center;line-height:1.1}
.dpt-empty{min-width:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:11px}
.dpt-categories{height:62px;display:flex;gap:2px;overflow-x:auto;padding:3px 4px;background:#0c070e;border-top:1px solid var(--line)}
.dpt-cat{flex:0 0 78px;border:0;border-radius:8px;background:transparent;color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:600}.dpt-cat-icon{font-size:21px;line-height:21px}.dpt-cat.active{background:var(--panel-2);color:var(--magenta-bright)}
.export-bar{display:none!important}
}
@media(min-width:801px){#duskPixelDock{display:none!important}}
'''
          html=r'''\n<!-- DUSKREEL-PIXELLAB-STYLE-TOOLS-V2 -->
<nav id="duskPixelDock" aria-label="Duskreel mobile editing tools">
<div id="duskPixelTools"><div class="dpt-empty">Choose a category below</div></div>
<div class="dpt-categories">
<button class="dpt-cat active" data-cat="media"><span class="dpt-cat-icon">▣</span>Media</button>
<button class="dpt-cat" data-cat="adjust"><span class="dpt-cat-icon">☷</span>Adjust</button>
<button class="dpt-cat" data-cat="effects"><span class="dpt-cat-icon">✦</span>Effects</button>
<button class="dpt-cat" data-cat="crop"><span class="dpt-cat-icon">⌗</span>Crop</button>
<button class="dpt-cat" data-cat="ai"><span class="dpt-cat-icon">AI</span>AI</button>
<button class="dpt-cat" data-cat="text"><span class="dpt-cat-icon">T</span>Text</button>
<button class="dpt-cat" data-cat="canvas"><span class="dpt-cat-icon">□</span>Canvas</button>
<button class="dpt-cat" data-cat="export"><span class="dpt-cat-icon">⇩</span>Export</button>
</div></nav>
<script>
(function(){
function init(){if(innerWidth>800)return;var p=document.querySelector('main .panel'),t=document.getElementById('duskPixelTools'),cs=[...document.querySelectorAll('.dpt-cat')];if(!p||!t)return;
var blocks=[...p.querySelectorAll('.block')],rules={media:['upload','image','photo','import'],adjust:['brightness','contrast','saturation','exposure','temperature','tint','sharpness','vignette','adjust'],effects:['effect','filter','preset','blur','vintage','art'],crop:['crop','ratio','rotate','flip','resize'],ai:['ai','noise','clean','remove','cartoon','sketch','spot'],text:['text','font','typography'],canvas:['canvas','size','background','border','shadow'],export:['export','download','share','format']};
function cat(b){var x=b.textContent.toLowerCase(),best='adjust',score=0;for(var k in rules){var n=rules[k].filter(q=>x.includes(q)).length;if(n>score){score=n;best=k}}return best}
function icon(x){x=x.toLowerCase();if(x.includes('upload')||x.includes('import'))return'＋';if(x.includes('brightness')||x.includes('exposure'))return'☀';if(x.includes('contrast'))return'◐';if(x.includes('saturation'))return'◉';if(x.includes('crop'))return'⌗';if(x.includes('rotate'))return'↻';if(x.includes('flip'))return'↔';if(x.includes('ai')||x.includes('noise')||x.includes('clean'))return'AI';if(x.includes('text')||x.includes('font'))return'T';if(x.includes('canvas')||x.includes('size'))return'□';if(x.includes('download')||x.includes('export'))return'⇩';if(x.includes('filter')||x.includes('effect'))return'✦';return'•'}
function render(c){cs.forEach(b=>b.classList.toggle('active',b.dataset.cat===c));t.innerHTML='';var seen=[];blocks.filter(b=>cat(b)===c).forEach(b=>[...b.querySelectorAll('button,.file-btn,.bg-remove-btn,.spot-btn')].forEach(e=>{var label=(e.textContent||e.getAttribute('aria-label')||e.title||'').trim();if(!label||seen.includes(label.toLowerCase()))return;seen.push(label.toLowerCase());var q=document.createElement('button');q.className='dpt-tool';q.type='button';q.innerHTML='<span class="dpt-icon">'+icon(label)+'</span><span class="dpt-label"></span>';q.querySelector('.dpt-label').textContent=label;q.onclick=()=>e.click();t.appendChild(q)}));if(!t.children.length)t.innerHTML='<div class="dpt-empty">More tools will appear here</div>'}
cs.forEach(b=>b.onclick=()=>render(b.dataset.cat));render('media')}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
'''
          s=s.replace('</head>',css+'\n</head>',1).replace('</body>',html+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make mobile editor tools PixelLab-style"
          git push
