name: Improve Duskreel mobile tools

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update mobile tools layout
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')

          s = p.read_text(encoding='utf-8')
          marker = 'DUSKREEL-CATEGORIZED-MOBILE-TOOLS-V1'
          if marker in s:
              print('Mobile tools update already present')
              raise SystemExit(0)

          css = r'''\n/* DUSKREEL-CATEGORIZED-MOBILE-TOOLS-V1 */
@media (max-width:800px){
  body{padding-bottom:0!important;overflow:hidden!important;}
  #app{height:100dvh!important;min-height:100dvh!important;}
  main{display:block!important;height:calc(100dvh - 52px - 60px)!important;min-height:0!important;position:relative!important;}
  main .rail{display:none!important;}
  main .panel{display:none!important;}
  main .stage{position:absolute!important;inset:0!important;padding:46px 10px 18px!important;display:flex!important;align-items:center!important;justify-content:center!important;}
  canvas#work{max-width:96vw!important;max-height:calc(100dvh - 205px)!important;}
  .stage-label{top:8px!important;left:10px!important;}
  .history-controls{top:8px!important;right:10px!important;}
  .zoom-controls{top:48px!important;right:10px!important;transform:scale(.92);transform-origin:top right;}
  .export-bar{height:60px!important;flex:0 0 60px!important;padding:0 10px!important;position:relative!important;z-index:70!important;}
  .export-bar .count{font-size:10px!important;}
  .export-bar .export-actions{gap:6px!important;}
  .format-select{padding:8px 7px!important;font-size:11px!important;max-width:92px!important;}
  .export-bar .btn-primary{padding:9px 12px!important;}

  #duskMobileNav{
    position:fixed;left:0;right:0;bottom:0;height:68px;z-index:100;
    display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
    padding:6px 5px calc(6px + env(safe-area-inset-bottom));
    background:rgba(16,8,18,.98);border-top:1px solid var(--line);
    box-shadow:0 -10px 30px rgba(0,0,0,.35);backdrop-filter:blur(14px);
  }
  #duskMobileNav button{
    border:0;background:transparent;color:var(--ink-dim);border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:9px;font-weight:600;min-width:0;cursor:pointer;
  }
  #duskMobileNav button .dmn-icon{font-size:20px;line-height:20px;}
  #duskMobileNav button.active{background:var(--panel-2);color:var(--magenta-bright);}

  #duskMobileSheet{
    position:fixed;left:0;right:0;bottom:68px;z-index:99;
    max-height:72dvh;overflow:hidden;background:var(--panel);
    border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
    box-shadow:0 -18px 45px rgba(0,0,0,.55);display:none;
  }
  #duskMobileSheet.open{display:flex;flex-direction:column;}
  #duskMobileSheet .dmn-sheet-head{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:13px 15px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  #duskMobileSheet .dmn-sheet-title{font-size:14px;font-weight:700;color:var(--ink);}
  #duskMobileSheet .dmn-close{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:8px;width:32px;height:32px;cursor:pointer;}
  #duskMobileSheet .dmn-sheet-body{overflow:auto;padding:0 0 16px;}
  #duskMobileSheet .block{display:none;border-bottom:1px solid var(--line);padding:16px 15px!important;}
  #duskMobileSheet .block.dmn-visible{display:block;}
  #duskMobileSheet .block h2{font-size:15px!important;color:var(--ink)!important;margin-bottom:14px!important;}
  #duskMobileSheet .block h3{font-size:11px!important;}
  #duskMobileSheet .ai-grid{grid-template-columns:1fr 1fr!important;gap:9px!important;}
  #duskMobileSheet .ai-tool{min-height:78px!important;padding:12px!important;font-size:12px!important;}
  #duskMobileSheet .crop-tools{grid-template-columns:repeat(3,1fr)!important;gap:8px!important;}
  #duskMobileSheet .crop-tools button{padding:12px 7px!important;font-size:12px!important;}
  #duskMobileSheet .fx-grid{grid-template-columns:repeat(3,1fr)!important;gap:8px!important;}
  #duskMobileSheet .fx-swatch{padding:6px!important;}
  #duskMobileSheet .fx-swatch span{font-size:10px!important;}
  #duskMobileSheet .file-btn,#duskMobileSheet .bg-remove-btn,#duskMobileSheet .spot-btn{padding:12px!important;font-size:12px!important;}
  #duskMobileSheet input[type=range]{height:5px!important;}

  #duskMobileBackdrop{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.52);display:none;}
  #duskMobileBackdrop.show{display:block;}
}
@media (min-width:801px){#duskMobileNav,#duskMobileSheet,#duskMobileBackdrop{display:none!important;}}
'''

          html = r'''\n<!-- DUSKREEL-CATEGORIZED-MOBILE-TOOLS-V1 -->
<div id="duskMobileBackdrop"></div>
<div id="duskMobileSheet" aria-hidden="true">
  <div class="dmn-sheet-head"><span class="dmn-sheet-title">Editing Tools</span><button class="dmn-close" type="button" aria-label="Close tools">×</button></div>
  <div class="dmn-sheet-body"></div>
</div>
<nav id="duskMobileNav" aria-label="Editing tools">
  <button type="button" data-dmn-cat="media"><span class="dmn-icon">▣</span><span>Media</span></button>
  <button type="button" data-dmn-cat="adjust"><span class="dmn-icon">☷</span><span>Adjust</span></button>
  <button type="button" data-dmn-cat="effects"><span class="dmn-icon">✦</span><span>Effects</span></button>
  <button type="button" data-dmn-cat="crop"><span class="dmn-icon">⌗</span><span>Crop</span></button>
  <button type="button" data-dmn-cat="ai"><span class="dmn-icon">AI</span><span>AI Tools</span></button>
  <button type="button" data-dmn-cat="export"><span class="dmn-icon">⇩</span><span>Export</span></button>
</nav>
<script>
(function(){
  function initDuskMobileTools(){
    if(window.innerWidth>800) return;
    var panel=document.querySelector('main .panel');
    var sheet=document.getElementById('duskMobileSheet');
    var body=sheet&&sheet.querySelector('.dmn-sheet-body');
    var nav=document.getElementById('duskMobileNav');
    var backdrop=document.getElementById('duskMobileBackdrop');
    if(!panel||!sheet||!body||!nav||!backdrop) return;

    var blocks=[].slice.call(panel.querySelectorAll('.block'));
    var keys={
      media:['upload','photo','background','image'],
      adjust:['adjust','exposure','brightness','contrast','saturation','temperature','tint','sharpness','vignette'],
      effects:['effect','filter','preset','art'],
      crop:['crop','ratio','rotate','flip'],
      ai:['ai','noise','clean','remove','spot','cartoon','sketch'],
      export:['export','download','share']
    };
    function categoryFor(text){
      text=text.toLowerCase();
      for(var cat in keys){if(keys[cat].some(function(k){return text.indexOf(k)>=0;})) return cat;}
      return 'adjust';
    }
    blocks.forEach(function(block){
      block.dataset.dmnCategory=categoryFor(block.textContent||'');
      body.appendChild(block);
    });

    var title=sheet.querySelector('.dmn-sheet-title');
    function close(){
      sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');backdrop.classList.remove('show');
      nav.querySelectorAll('button').forEach(function(b){b.classList.remove('active');});
    }
    function open(cat){
      var matches=blocks.filter(function(b){return b.dataset.dmnCategory===cat;});
      if(!matches.length){return;}
      title.textContent=cat==='ai'?'AI Tools':cat.charAt(0).toUpperCase()+cat.slice(1)+' Tools';
      blocks.forEach(function(b){b.classList.toggle('dmn-visible',matches.indexOf(b)>=0);});
      sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');backdrop.classList.add('show');
      nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b.dataset.dmnCat===cat);});
      body.scrollTop=0;
    }
    nav.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click',function(){
        var cat=btn.dataset.dmnCat;
        if(sheet.classList.contains('open') && btn.classList.contains('active')) close(); else open(cat);
      });
    });
    sheet.querySelector('.dmn-close').addEventListener('click',close);
    backdrop.addEventListener('click',close);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initDuskMobileTools); else initDuskMobileTools();
})();
</script>
'''

          if '</head>' not in s or '</body>' not in s:
              raise SystemExit('index.html does not contain expected closing tags')
          s=s.replace('</head>', css+'\n</head>', 1)
          s=s.replace('</body>', html+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Updated index.html with categorized mobile tools')

      - name: Commit mobile UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve mobile editing tools navigation"
          git push
