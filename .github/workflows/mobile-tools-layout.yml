name: Improve Duskreel mobile tools

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PixelLab-style mobile toolbar
        run: python3 scripts/add-mobile-tools.py
      - name: Commit generated mobile UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Apply PixelLab-style mobile tools"
          git push
