name: Repair Duskreel core JavaScript

on:
  push:
    paths:
      - '.github/workflows/repair-core-javascript.yml'
  workflow_dispatch:

concurrency:
  group: duskreel-core-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair repeated async declaration and validate all scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=s
          s=re.sub(r'\basync\s+async\s+async\s+async\s+function\s+triggerDownload', 'async function triggerDownload', s)
          s=re.sub(r'\basync\s+async\s+function\s+', 'async function ', s)
          p.write_text(s,encoding='utf-8')
          print('Changed:', before != s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S)
          print('Inline scripts:',len(scripts))
          for i,js in enumerate(scripts,1): Path(f'/tmp/duskreel-script-{i}.js').write_text(js,encoding='utf-8')
          PY

          set -e
          for f in /tmp/duskreel-script-*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix broken JavaScript declaration in photo download'
          git push
