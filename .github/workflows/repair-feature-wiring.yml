name: Repair Duskreel feature wiring

on:
  push:
    paths:
      - '.github/workflows/repair-feature-wiring.yml'
  workflow_dispatch:

concurrency:
  group: duskreel-feature-wiring-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch login camera queue delete and PWA wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=s

          # 1) Make the mobile camera action safe and provide a real camera input.
          s=s.replace("if(action==='camera') cameraInput?.click();", "if(action==='camera') document.getElementById('cameraInput')?.click();")
          if 'id="cameraInput"' not in s:
              marker='<input id="photoInput"'
              pos=s.find(marker)
              if pos>=0:
                  end=s.find('>',pos)
                  if end>=0:
                      s=s[:end+1]+'\n<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">'+s[end+1:]
          # Feed camera files into the existing photoInput change pipeline.
          if 'duskreel-camera-input-bridge' not in s:
              s += '''\n<script id="duskreel-camera-input-bridge">\n(function(){\n  const cam=document.getElementById('cameraInput');\n  const photo=document.getElementById('photoInput');\n  if(!cam||!photo) return;\n  cam.addEventListener('change',function(){\n    if(!cam.files||!cam.files.length) return;\n    try{\n      const dt=new DataTransfer();\n      for(const f of cam.files) dt.items.add(f);\n      photo.files=dt.files;\n      photo.dispatchEvent(new Event('change',{bubbles:true}));\n    }catch(e){ console.error('Camera upload bridge failed',e); }\n  });\n})();\n</script>\n'''

          # 2) Ensure the login button is an explicit submit button and add a capture-level fallback.
          s=re.sub(r'(<form[^>]*id=["\']nameForm["\'][^>]*>.*?<button)(?![^>]*\btype=["\']submit["\'])([^>]*class=["\'][^"\']*auth-submit[^"\']*["\'])', r'\1 type="submit"\2', s, count=1, flags=re.I|re.S)
          if 'duskreel-auth-fallback' not in s:
              s += '''\n<script id="duskreel-auth-fallback">\n(function(){\n  document.addEventListener('submit',function(e){\n    const form=e.target;\n    if(!form||form.id!=='nameForm') return;\n    e.preventDefault();\n    const input=document.getElementById('nameInput');\n    const err=document.getElementById('nameError');\n    const name=(input?.value||'').trim();\n    if(!name){ err?.classList.add('show'); input?.focus(); return; }\n    err?.classList.remove('show');\n    if(typeof window.enterApp==='function') window.enterApp(name);\n    else { const auth=document.getElementById('authScreen'), app=document.getElementById('app'), label=document.getElementById('userLabel'); if(auth)auth.style.display='none'; if(app)app.style.display='flex'; if(label)label.textContent='Signed in as '+name; }\n  },true);\n})();\n</script>\n'''

          # 3) Add a remove button to every photo thumbnail, with state-safe deletion.
          if 'thumb-remove' not in s:
              s=s.replace("d.innerHTML = `<img src=\"${p.img.src}\">`;", "d.innerHTML = `<img src=\"${p.img.src}\"><button type=\"button\" class=\"thumb-remove\" title=\"Remove photo\" aria-label=\"Remove photo\">×</button>`;")
              needle="""    d.addEventListener('click', ()=>{\n      state.activeIndex = i;\n      loadPhotoEdit(state.photos[i]);\n      syncControlsFromState();\n      renderThumbs();\n      render();\n    });"""
              replacement=needle+"""\n    const removeBtn=d.querySelector('.thumb-remove');\n    removeBtn?.addEventListener('click', (ev)=>{\n      ev.preventDefault(); ev.stopPropagation();\n      state.photos.splice(i,1);\n      if(!state.photos.length){ state.activeIndex=-1; }\n      else if(state.activeIndex>i){ state.activeIndex--; }\n      else if(state.activeIndex>=state.photos.length){ state.activeIndex=state.photos.length-1; }\n      if(state.activeIndex>=0){ loadPhotoEdit(state.photos[state.activeIndex]); syncControlsFromState(); }\n      renderThumbs(); renderStageVisibility(); render(); pushHistory();\n    });"""
              if needle in s: s=s.replace(needle,replacement,1)
              css='''\n<style id="duskreel-thumb-delete-css">\n.thumb{position:relative!important;}\n.thumb-remove{position:absolute!important;top:3px!important;right:3px!important;width:22px!important;height:22px!important;border:0!important;border-radius:50%!important;background:rgba(0,0,0,.78)!important;color:#fff!important;font-size:16px!important;line-height:20px!important;padding:0!important;z-index:5!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;touch-action:manipulation!important;}\n.thumb-remove:active{transform:scale(.92);}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)

          # 4) Register the existing service worker. This was missing from index.html.
          if 'duskreel-sw-registration' not in s:
              s += '''\n<script id="duskreel-sw-registration">\nif('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Duskreel service worker registration failed',err))); }\n</script>\n'''

          p.write_text(s,encoding='utf-8')
          print('Changed index:', before!=s)
          PY

      - name: Validate all inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S)
          print('Inline scripts:',len(scripts))
          for i,js in enumerate(scripts,1): Path(f'/tmp/duskreel-script-{i}.js').write_text(js,encoding='utf-8')
          PY
          set -e
          for f in /tmp/duskreel-script-*.js; do [ -e "$f" ] && node --check "$f"; done

      - name: Commit feature wiring repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair Duskreel feature wiring and photo queue controls'
          git push
